# Versión de la tienda para Cloudflare Workers + D1 (SQLite).
name = "tienda"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "../app/frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tienda"
database_id = "aa6abc8d-45c4-438a-be9e-da97fb88dd19"
migrations_dir = "migrations"

# Aviso de la mañana al móvil: a las 8:00 en verano y a las 9:00 en invierno, hora de España
[triggers]
crons = ["0 7 * * *"]
