# Entorno completo para probar en local sin máquina virtual:
#   docker compose up --build
# Web:        http://localhost:8080
# API (docs): http://localhost:8000/api/docs
# MariaDB:    localhost:3307 (para DBeaver)
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST_PERMITIDO: "%"
      TZ: Europe/Madrid
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - datos-bd:/var/lib/mysql
    ports:
      - "3307:3306"   # 3307 en el PC por si ya hay un MySQL/MariaDB en el 3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  backend:
    build: ./app/backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      TZ: Europe/Madrid
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./app/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  datos-bd:
