# /etc/ssh/sshd_config.d/99-tienda.conf
# Endurecimiento de SSH para el servidor de la tienda.

# Nadie entra directamente como root: se entra con el usuario y se usa sudo
PermitRootLogin no

# Solo claves (ed25519). Nada de contraseñas: así no sirven los ataques
# de fuerza bruta.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Solo los usuarios del grupo "ssh-tienda" pueden entrar por SSH
AllowGroups ssh-tienda

MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no

# Cierra sesiones abandonadas (2 x 300 s sin respuesta)
ClientAliveInterval 300
ClientAliveCountMax 2
