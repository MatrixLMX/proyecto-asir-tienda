# /etc/fail2ban/filter.d/tienda-web.conf
# Intentos de login fallidos en la web de la tienda. La API los escribe
# en el registro del servicio tienda-api (journalctl -u tienda-api) así:
#   WARNING tienda.auth: LOGIN FALLIDO usuario='pepe' ip=192.168.1.50

[Definition]
failregex  = LOGIN FALLIDO usuario=.* ip=<HOST>$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=tienda-api.service
