# /etc/apache2/sites-available/tienda.conf
# Apache sirve la web (ficheros estáticos de React) y hace de proxy
# inverso hacia la API en Python, que solo escucha en 127.0.0.1:8000.

<VirtualHost *:80>
    ServerName tienda.local
    DocumentRoot /var/www/tienda
    # El certificado de la CA de la tienda se descarga por HTTP (aún no
    # está instalado en el dispositivo); todo lo demás va por HTTPS, al
    # mismo nombre o IP con el que se ha entrado.
    AddType application/x-x509-ca-cert .crt
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/ca-tienda\.crt$
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName tienda.local

    SSLEngine on
    SSLCertificateFile    /etc/ssl/tienda/tienda.crt
    SSLCertificateKeyFile /etc/ssl/tienda/tienda.key

    DocumentRoot /var/www/tienda
    AddType application/manifest+json .webmanifest
    <Directory /var/www/tienda>
        Require all granted
        Options -Indexes
        # Aplicación de una sola página: cualquier ruta -> index.html
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    ErrorLog  ${APACHE_LOG_DIR}/tienda_error.log
    CustomLog ${APACHE_LOG_DIR}/tienda_access.log combined
</VirtualHost>
